listening-port=3478
tls-listening-port=5349
realm=myrealm.com
use-auth-secret
static-auth-secret=${TURN_SECRET}

# TLS certificates (bind via Docker volume or real paths)
cert=/etc/ssl/cert.pem
pkey=/etc/ssl/privkey.pem

# Relay port range — open these in your firewall
min-port=49152
max-port=65535

# Logging
log-file=stdout
no-multicast-peers
no-cli
verbose

# Block private IP ranges (SSRF protection)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# External IP must be set for relay to work behind NAT
# external-ip=YOUR_PUBLIC_IP

# Fingerprint in TURN messages
fingerprint
