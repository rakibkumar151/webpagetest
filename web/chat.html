<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chet — Messages</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        window.APP_CONFIG = {
            SIGNALING_URL: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? window.location.origin
                : 'https://webpagetest-8jyd.onrender.com'
        };
        try {
            if (!localStorage.getItem('chet_token')) {
                window.location.replace('auth.html');
            }
        } catch(e) { window.location.replace('auth.html'); }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #090912;
            --nav: rgba(10,10,20,0.85);
            --surface: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --text: #f0f0ff;
            --muted: rgba(240,240,255,0.45);
            --accent1: #7c6cff;
            --accent2: #a855f7;
            --msg-sent: linear-gradient(135deg, #7c6cff, #a855f7);
            --msg-recv: rgba(255,255,255,0.08);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Nav */
        nav {
            position: sticky; top: 0; z-index: 100;
            background: var(--nav);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            height: 64px; flex-shrink: 0;
        }
        .back-btn {
            background: none; border: none; color: var(--text);
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            font-family: inherit; font-size: 15px; font-weight: 600;
        }
        .back-btn:hover { color: var(--accent1); }
        .chat-header-user {
            display: flex; align-items: center; gap: 10px;
        }
        .chat-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--surface);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px;
        }
        .chat-name { font-weight: 600; font-size: 15px; }

        /* Chat Body */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-row {
            display: flex;
            width: 100%;
        }
        .msg-row.sent { justify-content: flex-end; }
        .msg-row.recv { justify-content: flex-start; }

        .msg-bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }
        .msg-row.sent .msg-bubble {
            background: var(--msg-sent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg-row.recv .msg-bubble {
            background: var(--msg-recv);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        
        .msg-time {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
            text-align: right;
        }
        .msg-row.recv .msg-time { text-align: left; }

        /* Input Area */
        .chat-input-area {
            padding: 16px 20px;
            background: var(--nav);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px 18px;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        .chat-input:focus { border-color: var(--accent1); }
        .send-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            border: none; color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .loading-chat {
            text-align: center; margin: auto; color: var(--muted);
        }
        
        .encrypted-badge {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 12px; font-size: 12px; color: var(--muted);
            text-align: center;
        }
        
        @media (max-width: 600px) {
            .chat-container { border: none; }
        }
    </style>
</head>
<body>

<nav>
    <button class="back-btn" onclick="window.location.href='home.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
    </button>
    <div class="chat-header-user">
        <div class="chat-name" id="chatPartnerName">Loading...</div>
        <div class="chat-avatar" id="chatAvatar">?</div>
    </div>
    <div style="width:70px"></div>
</nav>

<div class="chat-container">
    <div class="encrypted-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Server-Side Encrypted
    </div>
    
    <div class="chat-messages" id="messagesArea">
        <div class="loading-chat" id="loadingIndicator">Loading messages...</div>
    </div>
    
    <div class="chat-input-area">
        <input type="text" id="msgInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn" class="send-btn" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>

<script>
    const API = (window.APP_CONFIG && window.APP_CONFIG.SIGNALING_URL) || window.location.origin;
    const token = localStorage.getItem('chet_token');
    const me = JSON.parse(localStorage.getItem('chet_user') || '{}');
    
    const partnerStr = sessionStorage.getItem('chatPartner');
    if (!partnerStr) {
        window.location.replace('home.html');
    }
    const partner = JSON.parse(partnerStr);
    
    // UI Setup
    document.getElementById('chatPartnerName').textContent = `${partner.first_name || ''} ${partner.last_name || ''}`;
    const initials = (partner.first_name?.[0] || '') + (partner.last_name?.[0] || '');
    document.getElementById('chatAvatar').textContent = initials || '?';
    
    const msgsArea = document.getElementById('messagesArea');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    
    let socket;
    
    function scrollToBottom() {
        msgsArea.scrollTop = msgsArea.scrollHeight;
    }
    
    function formatTime(isoStr) {
        const d = new Date(isoStr + 'Z'); // sqlite utc
        if (isNaN(d.getTime())) return '';
        let h = d.getHours(), m = d.getMinutes();
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        m = m < 10 ? '0'+m : m;
        return `${h}:${m} ${ampm}`;
    }
    
    function esc(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    
    function appendMessage(msg) {
        const isMe = msg.from_uid === me.uid;
        const row = document.createElement('div');
        row.className = `msg-row ${isMe ? 'sent' : 'recv'}`;
        row.innerHTML = `
            <div>
                <div class="msg-bubble">${esc(msg.text)}</div>
                <div class="msg-time">${formatTime(msg.created_at)}</div>
            </div>
        `;
        msgsArea.appendChild(row);
        scrollToBottom();
    }
    
    async function loadHistory() {
        try {
            const res = await fetch(`${API}/api/messages/${partner.uid}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.status === 401) {
                localStorage.removeItem('chet_token');
                window.location.replace('auth.html');
                return;
            }
            if (!res.ok) throw new Error('fetch fail');
            const msgs = await res.json();
            
            document.getElementById('loadingIndicator').remove();
            
            if (msgs.length === 0) {
                msgsArea.innerHTML += `<div style="text-align:center; color:rgba(255,255,255,0.3); font-size:13px; margin:20px;">Start of your secure conversation with ${esc(partner.first_name)}</div>`;
            } else {
                msgs.forEach(m => appendMessage(m));
            }
        } catch(e) {
            document.getElementById('loadingIndicator').textContent = 'Failed to load messages';
        }
    }
    
    async function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;
        
        msgInput.value = '';
        msgInput.focus();
        sendBtn.disabled = true;
        
        try {
            const res = await fetch(`${API}/api/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ to_uid: partner.uid, text })
            });
            if (res.ok) {
                const newMsg = await res.json();
                appendMessage(newMsg);
            }
        } catch(e) {
            console.error(e);
        } finally {
            sendBtn.disabled = false;
        }
    }
    
    msgInput.addEventListener('input', () => {
        sendBtn.disabled = msgInput.value.trim().length === 0;
    });
    
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
    
    sendBtn.addEventListener('click', sendMessage);
    
    // --- SOCKET.IO FOR REALTIME ---
    function initSocket() {
        var s = document.createElement('script');
        s.src = API + '/socket.io/socket.io.js';
        s.onload = function() {
            socket = io(API, { transports: ['websocket', 'polling'] });
            socket.on('connect', () => {
                socket.emit('register_user', token);
            });
            socket.on('new_message', (msg) => {
                // If it's from the person we are chatting with
                if (msg.from_uid === partner.uid) {
                    appendMessage(msg);
                }
            });
        };
        document.body.appendChild(s);
    }
    
    loadHistory().then(() => {
        initSocket();
    });
</script>
</body>
</html>
