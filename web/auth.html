<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chet — Sign In or Create Account</title>
    <meta name="description" content="Join Chet and make secure voice calls with friends.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        window.APP_CONFIG = {
            SIGNALING_URL: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? window.location.origin
                : 'https://webpagetest-8jyd.onrender.com'
        };
        // Redirect if already logged in
        try {
            if (localStorage.getItem('chet_token') && localStorage.getItem('chet_user')) {
                window.location.replace('home.html');
            }
        } catch(e) {}
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #090912;
            --surface:  rgba(255,255,255,0.04);
            --border:   rgba(255,255,255,0.08);
            --text:     #f0f0ff;
            --muted:    rgba(240,240,255,0.45);
            --accent1:  #7c6cff;
            --accent2:  #a855f7;
            --accent3:  #06b6d4;
            --error:    #ff5e7c;
            --success:  #34d399;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient glow blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 600px; height: 600px;
            background: var(--accent1);
            top: -200px; left: -150px;
            animation: drift1 12s ease-in-out infinite alternate;
        }
        body::after {
            width: 500px; height: 500px;
            background: var(--accent2);
            bottom: -150px; right: -100px;
            animation: drift2 10s ease-in-out infinite alternate;
        }
        @keyframes drift1 { to { transform: translate(60px, 80px); } }
        @keyframes drift2 { to { transform: translate(-60px, -80px); } }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            justify-content: center;
        }
        .logo-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .logo-text { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-text span { background: linear-gradient(90deg, var(--accent1), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 28px;
            border: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 16px rgba(124,108,255,0.35);
        }

        /* Forms */
        .form { display: none; flex-direction: column; gap: 16px; }
        .form.active { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .field input {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input::placeholder { color: rgba(255,255,255,0.2); }
        .field input:focus {
            border-color: var(--accent1);
            box-shadow: 0 0 0 3px rgba(124,108,255,0.15);
        }

        .submit-btn {
            margin-top: 4px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,108,255,0.4); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .submit-btn .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .msg {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }
        .msg.error  { background: rgba(255,94,124,0.12); border: 1px solid rgba(255,94,124,0.3); color: var(--error); display: block; }
        .msg.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.25); color: var(--success); display: block; }

        .divider {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin: 4px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%; width: 40%;
            height: 1px;
            background: var(--border);
        }
        .divider::before { left: 0; }
        .divider::after  { right: 0; }

        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
            .row  { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon">💬</div>
        <div class="logo-text"><span>Chet</span></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="registerTab" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- LOGIN -->
    <form class="form active" id="loginForm" onsubmit="doLogin(event)">
        <div id="loginMsg" class="msg"></div>
        <div class="field">
            <label>Email or Username</label>
            <input type="text" id="loginIdentifier" placeholder="your@email.com or username" autocomplete="username" required>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="submit-btn" id="loginBtn">Sign In</button>
    </form>

    <!-- REGISTER -->
    <form class="form" id="registerForm" onsubmit="doRegister(event)">
        <div id="registerMsg" class="msg"></div>
        <div class="row">
            <div class="field">
                <label>First Name</label>
                <input type="text" id="regFirstName" placeholder="Rakib" required>
            </div>
            <div class="field">
                <label>Last Name</label>
                <input type="text" id="regLastName" placeholder="Kumar" required>
            </div>
        </div>
        <div class="field">
            <label>Username</label>
            <input type="text" id="regUsername" placeholder="rakib_123" required pattern="[a-zA-Z0-9_]{3,20}">
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="rakib@email.com" required>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Min. 6 characters" required minlength="6">
        </div>
        <button type="submit" class="submit-btn" id="registerBtn">Create Account</button>
    </form>
</div>

<script>
const API = (window.APP_CONFIG && window.APP_CONFIG.SIGNALING_URL) || window.location.origin;

function switchTab(tab) {
    document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    document.getElementById('registerForm').classList.toggle('active', tab === 'register');
    document.getElementById('loginTab').classList.toggle('active', tab === 'login');
    document.getElementById('registerTab').classList.toggle('active', tab === 'register');
    document.getElementById('loginMsg').className = 'msg';
    document.getElementById('registerMsg').className = 'msg';
}

function setMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
}

function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Please wait...';
    } else {
        btn.disabled = false;
        btn.innerHTML = btn.id === 'loginBtn' ? 'Sign In' : 'Create Account';
    }
}

function saveAndRedirect(data) {
    localStorage.setItem('chet_token', data.token);
    localStorage.setItem('chet_user', JSON.stringify({
        uid: data.uid,
        username: data.username,
        first_name: data.first_name,
        last_name: data.last_name
    }));
    window.location.replace('home.html');
}

async function doLogin(e) {
    e.preventDefault();
    const identifier = document.getElementById('loginIdentifier').value.trim();
    const password   = document.getElementById('loginPassword').value;
    if (!identifier || !password) { setMsg('loginMsg', 'Please fill all fields.', 'error'); return; }
    setLoading('loginBtn', true);
    try {
        const r = await fetch(`${API}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, password })
        });
        const data = await r.json();
        if (!r.ok) { setMsg('loginMsg', data.error || 'Login failed.', 'error'); return; }
        saveAndRedirect(data);
    } catch(err) {
        setMsg('loginMsg', 'Connection error. Please try again.', 'error');
    } finally {
        setLoading('loginBtn', false);
    }
}

async function doRegister(e) {
    e.preventDefault();
    const first_name = document.getElementById('regFirstName').value.trim();
    const last_name  = document.getElementById('regLastName').value.trim();
    const username   = document.getElementById('regUsername').value.trim();
    const email      = document.getElementById('regEmail').value.trim();
    const password   = document.getElementById('regPassword').value;
    if (!first_name || !last_name || !username || !email || !password) {
        setMsg('registerMsg', 'Please fill all fields.', 'error'); return;
    }
    setLoading('registerBtn', true);
    try {
        const r = await fetch(`${API}/api/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ first_name, last_name, username, email, password })
        });
        const data = await r.json();
        if (!r.ok) { setMsg('registerMsg', data.error || 'Registration failed.', 'error'); return; }
        saveAndRedirect(data);
    } catch(err) {
        setMsg('registerMsg', 'Connection error. Please try again.', 'error');
    } finally {
        setLoading('registerBtn', false);
    }
}
</script>
</body>
</html>
