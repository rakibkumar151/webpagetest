<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chet — Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        window.APP_CONFIG = {
            SIGNALING_URL: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? window.location.origin
                : 'https://webpagetest-8jyd.onrender.com'
        };
        // Auth guard
        try {
            if (!localStorage.getItem('chet_token')) {
                window.location.replace('auth.html');
            }
        } catch(e) { window.location.replace('auth.html'); }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:      #090912;
            --nav:     rgba(10,10,20,0.85);
            --surface: rgba(255,255,255,0.04);
            --border:  rgba(255,255,255,0.08);
            --text:    #f0f0ff;
            --muted:   rgba(240,240,255,0.45);
            --accent1: #7c6cff;
            --accent2: #a855f7;
            --accent3: #06b6d4;
            --card-h:  rgba(255,255,255,0.07);
        }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Background blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 700px; height: 700px;
            background: var(--accent1);
            top: -300px; left: -200px;
        }
        body::after {
            width: 500px; height: 500px;
            background: var(--accent2);
            bottom: -200px; right: -100px;
        }

        /* NAV */
        nav {
            position: sticky; top: 0; z-index: 100;
            background: var(--nav);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            display: flex;
            align-items: center;
            height: 64px;
            gap: 16px;
        }
        .nav-logo {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: inherit;
            flex-shrink: 0;
        }
        .nav-logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .nav-logo-text { font-size: 18px; font-weight: 800; }
        .nav-logo-text span { background: linear-gradient(90deg, var(--accent1), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-search {
            flex: 1;
            max-width: 420px;
            margin: 0 auto;
            position: relative;
        }
        .nav-search input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 10px 16px 10px 40px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .nav-search input::placeholder { color: var(--muted); }
        .nav-search input:focus { border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(124,108,255,0.15); }
        .nav-search .search-icon {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .nav-profile {
            display: flex; align-items: center; gap: 10px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; color: #fff;
            flex-shrink: 0;
        }
        .nav-name { font-weight: 600; font-size: 14px; }

        .logout-btn {
            border: none;
            background: rgba(255,94,124,0.12);
            color: #ff5e7c;
            border: 1px solid rgba(255,94,124,0.2);
            padding: 7px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover { background: rgba(255,94,124,0.2); }

        /* MAIN */
        main {
            flex: 1;
            position: relative; z-index: 1;
            padding: 28px 20px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* PROFILE CARD */
        .profile-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
            animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

        .profile-avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 800; color: #fff;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(124,108,255,0.35);
        }
        .profile-info { flex: 1; min-width: 0; }
        .profile-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .profile-username { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
        .uid-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(124,108,255,0.12);
            border: 1px solid rgba(124,108,255,0.25);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent1);
            cursor: pointer;
            transition: all 0.2s;
            user-select: all;
        }
        .uid-badge:hover { background: rgba(124,108,255,0.2); }
        .uid-badge.copied { color: var(--accent3); border-color: var(--accent3); }

        /* SECTION */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .section-title { font-size: 18px; font-weight: 700; }
        .section-count {
            background: rgba(124,108,255,0.15);
            color: var(--accent1);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }

        /* USER LIST */
        .user-list { display: flex; flex-direction: column; gap: 10px; }
        .user-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s;
            animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1) both;
        }
        .user-card:hover { background: var(--card-h); border-color: rgba(124,108,255,0.25); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
        .user-card .avatar { flex-shrink: 0; position: relative; }
        .user-card-info { flex: 1; min-width: 0; }
        .user-card-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .user-card-sub { font-size: 12px; color: var(--muted); }
        .user-card-uid { font-size: 11px; color: rgba(124,108,255,0.7); font-weight: 600; margin-top: 2px; }
        .user-card-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .user-card:hover .user-card-actions { opacity: 1; }

        .action-btn {
            width: 38px; height: 38px;
            border: none; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.18s;
        }
        .call-btn  { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.25); color: #34d399; }
        .call-btn:hover  { background: rgba(52,211,153,0.22); transform: scale(1.08); }
        .msg-btn  { background: rgba(124,108,255,0.12); border: 1px solid rgba(124,108,255,0.25); color: var(--accent1); }
        .msg-btn:hover  { background: rgba(124,108,255,0.22); transform: scale(1.08); }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--muted);
        }
        .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { font-size: 15px; }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            gap: 12px;
            color: var(--muted);
        }
        .spin {
            width: 20px; height: 20px;
            border: 2px solid rgba(124,108,255,0.2);
            border-top-color: var(--accent1);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(30,30,50,0.95);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(16px);
            transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
            z-index: 999;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 600px) {
            .nav-name { display: none; }
            .user-card-actions { opacity: 1; }
            .profile-card { flex-wrap: wrap; }
            .nav-search { max-width: 100%; }
        }
    </style>
</head>
<body>

<nav>
    <a class="nav-logo" href="home.html">
        <div class="nav-logo-icon">💬</div>
        <div class="nav-logo-text"><span>Chet</span></div>
    </a>
    <div class="nav-search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search people by name, username or UID..." autocomplete="off">
    </div>
    <div class="nav-profile">
        <div class="avatar" id="navAvatar">?</div>
        <span class="nav-name" id="navName">Loading...</span>
    </div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
</nav>

<main>
    <!-- Profile Card -->
    <div class="profile-card" id="profileCard" style="display:none">
        <div class="profile-avatar" id="profileAvatar">?</div>
        <div class="profile-info">
            <div class="profile-name" id="profileName">Loading...</div>
            <div class="profile-username" id="profileUsername">@username</div>
            <div class="uid-badge" id="uidBadge" onclick="copyUID()" title="Click to copy">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span id="uidText">UID...</span>
            </div>
        </div>
    </div>

    <!-- Users Section -->
    <div class="section-header">
        <div class="section-title">People</div>
        <div class="section-count" id="userCount">0</div>
    </div>

    <div class="user-list" id="userList">
        <div class="loading-state">
            <div class="spin"></div>
            <span>Loading people...</span>
        </div>
    </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API  = (window.APP_CONFIG && window.APP_CONFIG.SIGNALING_URL) || window.location.origin;
const token = localStorage.getItem('chet_token');
const me    = JSON.parse(localStorage.getItem('chet_user') || '{}');

let searchTimeout = null;
let allUsers      = [];

function logout() {
    localStorage.removeItem('chet_token');
    localStorage.removeItem('chet_user');
    sessionStorage.removeItem('activeCall');
    window.location.replace('auth.html');
}

function showToast(msg, duration = 2000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
}

function initials(u) {
    if (!u) return '?';
    const parts = [u.first_name || '', u.last_name || ''].filter(Boolean);
    return parts.map(p => p[0].toUpperCase()).join('') || (u.username || '?')[0].toUpperCase();
}

function getColor(uid) {
    const colors = [
        ['#7c6cff','#a855f7'], ['#06b6d4','#7c6cff'],
        ['#f59e0b','#ef4444'], ['#10b981','#06b6d4'],
        ['#ec4899','#a855f7']
    ];
    const i = (uid || '').split('').reduce((a,c) => a + c.charCodeAt(0), 0) % colors.length;
    return `linear-gradient(135deg, ${colors[i][0]}, ${colors[i][1]})`;
}

function initProfile() {
    if (!me.uid) { logout(); return; }
    const init = initials(me);
    document.getElementById('navAvatar').textContent = init;
    document.getElementById('navName').textContent = me.first_name || me.username;
    document.getElementById('profileAvatar').textContent = init;
    document.getElementById('profileAvatar').style.background = getColor(me.uid);
    document.getElementById('profileName').textContent = (me.first_name || '') + ' ' + (me.last_name || '');
    document.getElementById('profileUsername').textContent = '@' + me.username;
    document.getElementById('uidText').textContent = me.uid;
    document.getElementById('profileCard').style.display = 'flex';
}

function copyUID() {
    navigator.clipboard.writeText(me.uid || '').then(() => {
        const badge = document.getElementById('uidBadge');
        badge.classList.add('copied');
        showToast('UID copied!');
        setTimeout(() => badge.classList.remove('copied'), 2000);
    });
}

function getCallId(uidA, uidB) {
    const sorted = [uidA, uidB].sort();
    return sorted[0] + '_' + sorted[1];
}

async function startCall(user) {
    const token = localStorage.getItem('chet_token');
    try {
        const r = await fetch(`${API}/api/calls/initiate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ target_uid: user.uid })
        });
        if (r.status === 401) { logout(); return; }
        if (!r.ok) { showToast('Failed to start call. Try again.'); return; }
        const data = await r.json();

        // Store in sessionStorage ONLY — callId never goes in the URL
        sessionStorage.setItem('activeCall', JSON.stringify({
            callId: data.callId,
            sessionId: data.sessionId,
            secondsConnected: 0,
            isMuted: false,
            isVideoMuted: true,
            isRemoteScreenSharing: false
        }));
        sessionStorage.setItem('callPartner', JSON.stringify(user));

        // Navigate without callId in URL
        window.location.href = 'index.html';
    } catch(e) {
        showToast('Connection error. Check your internet.');
    }
}

function startChat(user) {
    sessionStorage.setItem('chatPartner', JSON.stringify(user));
    window.location.href = 'chat.html';
}


function renderUsers(users) {
    const list = document.getElementById('userList');
    document.getElementById('userCount').textContent = users.length;

    if (!users.length) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="emoji">👥</div>
                <p>No people found</p>
            </div>`;
        return;
    }

    list.innerHTML = users.map((u, i) => `
        <div class="user-card" style="animation-delay:${i * 0.04}s" onclick="startCall(${JSON.stringify(u).replace(/"/g, '&quot;')})">
            <div class="avatar" style="background:${getColor(u.uid)}">
                ${initials(u)}
                <div style="position:absolute; bottom:0; right:0; width:12px; height:12px; border-radius:50%; border:2px solid var(--surface); background:${u.is_online ? '#10b981' : '#6b7280'}"></div>
            </div>
            <div class="user-card-info">
                <div class="user-card-name">${esc(u.first_name)} ${esc(u.last_name)}</div>
                <div class="user-card-sub">@${esc(u.username)} • ${u.is_online ? '<span style="color:#10b981">Active now</span>' : esc(formatLastActive(u.last_active))}</div>
                <div class="user-card-uid">${esc(u.uid)}</div>
            </div>
            <div class="user-card-actions">
                <button class="action-btn call-btn" title="Voice Call" onclick="event.stopPropagation(); startCall(${JSON.stringify(u).replace(/"/g, '&quot;')})">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.1a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6 6l1.27-.85a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </button>
                <button class="action-btn msg-btn" title="Message" onclick="event.stopPropagation(); startChat(${JSON.stringify(u).replace(/"/g, '&quot;')})">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </button>
            </div>
        </div>
    `).join('');
}

function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatLastActive(isoString) {
    if (!isoString) return 'Active a long time ago';
    const d = new Date(isoString);
    if (isNaN(d.getTime())) {
        const d2 = new Date(isoString + 'Z');
        if (isNaN(d2.getTime())) return 'Active a long time ago';
        else isoString = isoString + 'Z';
    }
    const diff = Math.floor((new Date() - new Date(isoString)) / 1000);
    if (diff < 60) return \`Active \${Math.max(1, diff)}s ago\`;
    const m = Math.floor(diff / 60);
    if (m < 60) return \`Active \${m}m ago\`;
    const h = Math.floor(m / 60);
    if (h < 24) return \`Active \${h}h ago\`;
    const days = Math.floor(h / 24);
    if (days < 30) return \`Active \${days}d ago\`;
    const mo = Math.floor(days / 30);
    if (mo < 12) return \`Active \${mo}mo ago\`;
    return \`Active \${Math.floor(mo / 12)}y ago\`;
}

async function loadUsers(q = '') {
    const list = document.getElementById('userList');
    if (!allUsers.length || q) {
        list.innerHTML = `<div class="loading-state"><div class="spin"></div><span>Loading...</span></div>`;
    }
    try {
        const url = `${API}/api/users${q ? '?q=' + encodeURIComponent(q) : ''}`;
        const r   = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
        if (r.status === 401) { logout(); return; }
        const data = await r.json();
        if (!q) allUsers = data;
        renderUsers(data);
    } catch(e) {
        list.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><p>Failed to load. Please refresh.</p></div>`;
    }
}

// Search
document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    const q = e.target.value.trim();
    if (!q) { renderUsers(allUsers); return; }
    searchTimeout = setTimeout(() => loadUsers(q), 300);
});

// Init
initProfile();
loadUsers();
</script>
</body>
</html>
